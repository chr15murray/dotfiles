[settings]
# Cooldown: only install tool versions that have been public for at least 7 days
minimum_release_age = "7d"
# Install npm: backend tools with pnpm
npm.package_manager = "pnpm"

[tools]
node = "lts"
pnpm = "latest"
herdr = "latest"
"github:carapace-sh/carapace-bin" = "latest"
go = "latest"
# Neovim + LazyVim external dependencies
neovim = "0.12"
fd = "latest"
fzf = "latest"
lazygit = "latest"
tree-sitter = "latest"
# Claude Code status line
"npm:ccstatusline" = "latest"
